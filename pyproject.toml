[project]
name = "genealogy"
version = "0.1.0"
description = "Local-first genealogy tool: GEDCOM import/export, SQLite storage, web UI, and UK research assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
genealogy = "genealogy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genealogy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
